# Builds ngp from the pinned Angular commit, checks that it compiles correctly, then benchmarks it.
#
# Results from this workflow are the ones the repo reports; local runs are only sanity checks.
# Each scenario runs as its own job on its own runner, and a final job merges their reports.
# Pushes and pull requests run a small sample. Use "Run workflow" to choose what to run.
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sizes:
        description: Generated app sizes, comma-separated (100, 1000, 5000)
        default: '100'
      real:
        description: Real apps from corpus/real, comma-separated (super-productivity, ghostfolio)
        default: ''
      scenarios:
        description: Scenarios, comma-separated (S1, S2, S3 incl. S4, S5, S6, S7, R)
        default: S1,S2,S3,S5,S6,S7,R
      engine:
        description: ngp analyzer engine for S1-S4, S6, S7 (native, wasm, sidecar)
        default: native
      runs:
        description: Measured runs per command
        default: '5'
      warmup:
        description: Warm-up runs per command
        default: '1'
      phase_runs:
        description: Instrumented runs for phase timings and peak RSS
        default: '1'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Rust, wasm-bindgen, hyperfine and Cargo's build output. The key changes whenever a pinned
      # version, a build script or a patch changes, so a cache hit never mixes toolchains.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/.cache/rust
            toolchain/.cache/tools
            toolchain/.cache/target
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.env', 'toolchain/*.sh', 'toolchain/patches/**', 'toolchain/tsconfig.backend.json') }}

      - run: pnpm toolchain

      # Artifacts drop the executable bit, so pack the outputs with tar.
      - name: Pack toolchain
        run: tar -czf toolchain.tgz toolchain/out toolchain/.cache/angular toolchain/.cache/tools/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain
          path: toolchain.tgz
          retention-days: 7

  checks:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain
      - run: tar -xzf toolchain.tgz

      - name: Golden tests on every engine
        run: pnpm smoke
      - name: Generate the 100-component app
        run: pnpm corpus --components 100
      - name: ngc and ngp compile it cleanly (ngp output checked by tsc 6 and tsgo 7)
        run: pnpm corpus:check corpus/generated/standalone-100-s1 --engine native,wasm,sidecar
      - name: "Negative control: same error code and template location from ngc, tsc and tsgo"
        run: pnpm corpus:check corpus/generated/standalone-100-s1 --engine native,wasm,sidecar --negative-control

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: results/smoke
          retention-days: 30

  # Turns the comma-separated scenario input into a job matrix.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - id: plan
        env:
          SCENARIOS: ${{ inputs.scenarios || 'S1,S2,S3,S5,S6,S7,R' }}
        run: |
          echo "scenarios=$(echo "$SCENARIOS" | tr -d ' ' | jq -Rc 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: [checks, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    env:
      # Corpus and compiler output live on a RAM disk: the runner's network disk adds noise
      # that has nothing to do with either compiler, and ngp writes more files than ngc.
      CORPUS_DIR: /dev/shm/corpus
      BENCH_OUT_DIR: /dev/shm/bench-out
      # Real apps keep their node_modules, so they stay on disk, next to the checkout.
      REAL_DIR: ${{ github.workspace }}/../real-apps
      SIZES: ${{ inputs.sizes || '100' }}
      REAL: ${{ inputs.real || '' }}
      ENGINE: ${{ inputs.engine || 'native' }}
      RUNS: ${{ inputs.runs || '5' }}
      WARMUP: ${{ inputs.warmup || '1' }}
      PHASE_RUNS: ${{ inputs.phase_runs || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain
      - run: tar -xzf toolchain.tgz

      # The harness reads peak RSS from GNU time.
      - name: Install GNU time
        run: test -x /usr/bin/time || (sudo apt-get update -q && sudo apt-get install -y -q time)

      - name: Generate corpus
        run: |
          for n in ${SIZES//,/ }; do
            pnpm corpus --components "$n"
          done

      - name: Fetch real apps
        if: env.REAL != ''
        run: |
          for app in ${REAL//,/ }; do
            node corpus/fetch-real.mjs "$app"
          done

      - name: Benchmark ${{ matrix.scenario }}
        run: |
          targets="$SIZES"
          for app in ${REAL//,/ }; do targets="$targets,real:$app"; done
          node harness/run.mjs --scenario "${{ matrix.scenario }}" --size "$targets" --engine "$ENGINE" \
            --runs "$RUNS" --warmup "$WARMUP" --phase-runs "$PHASE_RUNS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.scenario }}
          path: results/runs
          retention-days: 90

  report:
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: downloaded
      - name: Merge reports
        run: |
          node harness/report.mjs --merge results/merged $(ls -d downloaded/bench-*/*/)
          cat results/merged/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: |
            results/merged
            downloaded
          retention-days: 90
