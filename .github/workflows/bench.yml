# Builds ngp from the pinned Angular commit, checks that it compiles correctly, then benchmarks it.
#
# Results from this workflow are the ones the repo reports; local runs are only sanity checks.
# Pushes and pull requests run a small sample. Use "Run workflow" to choose sizes and run counts.
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sizes:
        description: Corpus sizes, comma-separated (100, 1000, 5000)
        default: '100'
      scenarios:
        description: Scenarios, comma-separated (S1, S2)
        default: S1,S2
      engine:
        description: ngp analyzer engine (native, wasm, sidecar)
        default: native
      runs:
        description: Measured runs per command
        default: '5'
      warmup:
        description: Warm-up runs per command
        default: '1'
      phase_runs:
        description: Instrumented runs for phase timings and peak RSS
        default: '1'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Benchmark output stays outside the checkout.
  BENCH_OUT_DIR: ${{ github.workspace }}/../bench-out

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Rust, wasm-bindgen, hyperfine and Cargo's build output. The key changes whenever a pinned
      # version, a build script or a patch changes, so a cache hit never mixes toolchains.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchain/.cache/rust
            toolchain/.cache/tools
            toolchain/.cache/target
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.env', 'toolchain/*.sh', 'toolchain/patches/**', 'toolchain/tsconfig.backend.json') }}

      - run: pnpm toolchain

      # Artifacts drop the executable bit, so pack the outputs with tar.
      - name: Pack toolchain
        run: tar -czf toolchain.tgz toolchain/out toolchain/.cache/angular toolchain/.cache/tools/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain
          path: toolchain.tgz
          retention-days: 7

  checks:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain
      - run: tar -xzf toolchain.tgz

      - name: Golden tests on every engine
        run: pnpm smoke
      - name: Generate the 100-component app
        run: pnpm corpus --components 100
      - name: ngc and ngp compile it cleanly
        run: pnpm corpus:check corpus/generated/standalone-100-s1 --engine native,wasm,sidecar
      - name: Negative control catches a planted type error
        run: pnpm corpus:check corpus/generated/standalone-100-s1 --engine native,wasm,sidecar --negative-control

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks
          path: results/smoke
          retention-days: 30

  bench:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SIZES: ${{ inputs.sizes || '100' }}
      SCENARIOS: ${{ inputs.scenarios || 'S1,S2' }}
      ENGINE: ${{ inputs.engine || 'native' }}
      RUNS: ${{ inputs.runs || '5' }}
      WARMUP: ${{ inputs.warmup || '1' }}
      PHASE_RUNS: ${{ inputs.phase_runs || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain
      - run: tar -xzf toolchain.tgz

      # The harness reads peak RSS from GNU time.
      - name: Install GNU time
        run: test -x /usr/bin/time || (sudo apt-get update -q && sudo apt-get install -y -q time)

      - name: Generate corpus
        run: |
          for n in ${SIZES//,/ }; do
            pnpm corpus --components "$n"
          done

      - name: Benchmark
        run: >
          node harness/run.mjs
          --scenario "$SCENARIOS" --size "$SIZES" --engine "$ENGINE"
          --runs "$RUNS" --warmup "$WARMUP" --phase-runs "$PHASE_RUNS"

      - name: Report to job summary
        if: always()
        run: cat results/runs/*/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: results/runs
          retention-days: 90
